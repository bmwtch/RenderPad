<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E2024">
  <title>RenderPad by Brahman WebTech</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Highlight.js -->
  <link id="theme1" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/vs2015.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- Dynamic font style -->
  <style id="style2"></style>
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <!-- Brand -->
    <a class="navbar-brand" href="#">🔧 Render Pad</a>

    <!-- Editable filename in center -->
    <span id="fileName" class="mx-auto text-light" ondblclick="renameFile()" style="cursor:pointer;">
      page.html
    </span>

    <!-- Toggler for navbar menu -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible navbar links -->
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link btn btn-warning" href="#" onclick="ShowContainer1()">Render HTML Page</a>
        </li>
        <li class="nav-item">
          <a class="nav-link btn btn-success" href="#" onclick="ShowContainer4()">Save as HTML</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="collapse" href="#settingsPanel" role="button" aria-expanded="false" aria-controls="settingsPanel">
            Settings
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Settings Panel -->
<div class="collapse bg-dark text-light p-3" id="settingsPanel">
  <br><br>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Theme</label>
      <select id="selectStyle" class="form-select">
       <option>androidstudio.min.css</option> 
       <option>codepen-embed.min.css</option> 
       <option>dark.min.css</option> 
       <option>default.min.css</option> 
       <option>github.min.css</option>
        <option>googlecode.min.css</option> 
       <option>intellij-light.min.css</option> 
       <option>vs.min.css</option> 
       <option>xcode.min.css</option>
      </select>
    </div>

    <div class="col-md-3 mb-3">
      <label class="form-label">Font Family</label>
      <select id="selectFont" class="form-select">
        <option>Roboto Mono</option>
        <option>Ubuntu Mono</option>
        <option>Cousine</option>
        <option>Courier Prime</option>
      </select>
    </div>

    <div class="col-md-3 mb-3">
      <label class="form-label">Font Size</label>
      <input id="inputFontSize" type="number" step=".1" value="12" class="form-control">
    </div>

    <div class="col-md-3 mb-3">
      <label class="form-label">Language</label>
      <select id="selectLanguage" class="form-select">
        <option value="language-html">HTML</option>
      </select>
    </div>
  </div>

  <div class="text-center mt-4">
    <h2>🎉 Enjoying HTML Renderer? 🎉</h2>
    <p>This ad-free, cost-free service is built for developers by Brahman WebTech (<a href="https://bmwtech.in/?ref=gitHub">https://bmwtech.in</a>). If you'd like to support my work, donations help keep it free of ads.</p>
    <a href="https://bmwtech.in/donateme.php" target="_blank" class="btn mb-3" style="background-color:#ff4081;color:white;">💖 Support here</a>
  </div>
</div>

<!-- Viewer -->
<div class="iframe-container">
  <iframe id="viewer" class="printDoc"></iframe>
</div>

<!-- Code Editor -->
<div id="divCodeWrapper">
  <pre id="preCode"><code id="codeBlock" class="language-html"></code></pre>
  <textarea id="textarea1" wrap="soft" spellcheck="false"
    placeholder="Type HTML code here or Paste HTML Code generated by any AI Client"
    oninput="update(0)"
    onkeydown="if(event.keyCode===9){var v=this.value,s=this.selectionStart,e=this.selectionEnd;this.value=v.substring(0,s)+'\t'+v.substring(e);this.selectionStart=this.selectionEnd=s+1;return false;}if(event.keyCode==8){update(1);}"></textarea>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
